services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: privora
      POSTGRES_USER: privora
      POSTGRES_PASSWORD: privora-dev-only
    ports: ["5432:5432"]
    volumes: ["privora_pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: privora
      MINIO_ROOT_PASSWORD: privora-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["privora_minio:/data"]
volumes:
  privora_pg:
  privora_minio:
